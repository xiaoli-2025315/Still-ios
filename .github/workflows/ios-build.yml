# ─────────────────────────────────────────────────────────────
# 在没有 Mac 的机器上：验证这份 SwiftUI 工程能不能编译、长什么样。
#
# 背景：这些 .swift 文件从没进过 Xcode（写它的机器是 Windows）。
#       「能不能编译」和「猫画得对不对」是现在最大的两个未知，这个 workflow 一次消掉。
#
# 这条 CI 的定位 = 编译验证（不依赖 Mac / 不依赖 Apple 账号，全免费）。
#   · 模拟器编译：验证 Swift 代码能编过、App 能起来；并尽量截图看猫长什么样。
#   · 真机 arm64 编译：验证代码能为真机架构编过（不签名）。
# 真正的「可安装签名包」CI 出不了 —— Xcode 16.4 禁止对真机 SDK 用 ad-hoc 签名，
# 而免费 runner 也没有你的证书。出包必须在【你自己的 Mac + 免费 Apple ID】上由
# Xcode 完成（自动签名），再经 AltStore / SideStore 侧载 —— 这一步仍免费，但需要一台 Mac。
#
# 产出：
#   1. build-log            编译日志（失败了看这个）
#   2. still-screenshots    模拟器真实截图（受苹果模拟器对 Widget 扩展的签名限制，可能软失败）
#   3. Still-unsigned-ipa   未签名真机包（默认就有）→ 下载回自己电脑，交给 AltStore
#                           用免费 Apple ID 重签并装到手机；这才是「不花钱也不用 Mac」的路径。
#   4. Still-device-ipa     已签名真机包（仅当你填了 IOS_SIGNING_CERT 等 Secrets 才产出）
#
# 花费：macOS runner 按 10 倍计费。一次约 10-15 分钟 = 消耗 100-150 分钟额度。
#       免费账号每月 2000 分钟，够跑 10-20 次；仓库设成 public 则完全免费不限量。
# ─────────────────────────────────────────────────────────────

name: iOS 编译验证

on:
  # 手动点一下就能跑：仓库 → Actions → iOS 编译验证 → Run workflow
  workflow_dispatch:

  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15

    # actions-gh-release / gh release upload 要写 Release，默认 token 是只读的
    permissions:
      contents: write

    # Node 20 在 2026-09-23 前仍可临时放行（GitHub 官方逃生阀），
    # 与下方升到 v5（Node 24）的 action 互为双保险。
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      # secrets 上下文不能写在 if: 里（GitHub 不允许），所以先映射到 env，再用 env 做判断
      # 免费账号默认全空 → 走「只验证编译 + 出未签名包」；填上才走「真签名出包」
      IOS_SIGNING_CERT: ${{ secrets.IOS_SIGNING_CERT }}                     # 开发证书 P12（base64）
      IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}   # P12 导出密码
      IOS_PROVISION_PROFILE_APP: ${{ secrets.IOS_PROVISION_PROFILE_APP }}       # 主 App 描述文件（base64）
      IOS_PROVISION_PROFILE_WIDGET: ${{ secrets.IOS_PROVISION_PROFILE_WIDGET }} # Widget 扩展描述文件（base64，可空）

      # ↓↓↓ 下面四个都给了默认值，【企业证书（In-House）】这条路上一个都不用填。
      #   默认值 = 2026-10-24 他给的那张证书实测出来的结果：
      #     证书主题  iPhone Distribution: HSBC Bank plc（企业分发，不是开发证书）
      #     Team      B8BGPMF2XK
      #     描述文件  hk.com.hsbc.enterprise.hsbchkrewards.local2 InHouse（App ID 写死，不是通配）
      #     到期      描述文件 2027-05-04 / 证书 2028-04-29
      #   ★ 换句话说：只要填了 IOS_SIGNING_CERT，就默认按「企业分发」签，
      #     包名会被换成描述文件里写死的那个 —— 这正是他自己用全能签装出来的那个包。
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY || 'iPhone Distribution' }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'enterprise' }}
      IOS_APP_BUNDLE_ID: ${{ secrets.IOS_APP_BUNDLE_ID || 'hk.com.hsbc.enterprise.hsbchkrewards.local2' }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM || 'B8BGPMF2XK' }}

    steps:
      - uses: actions/checkout@v5

      # 无论你把 .github 放在仓库根、还是整个仓库就是 Still-iOS，都能认出来
      - name: 定位工程目录
        id: loc
        run: |
          if [ -f "Still-iOS/project.yml" ]; then
            echo "dir=Still-iOS" >> "$GITHUB_OUTPUT"
          elif [ -f "project.yml" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::找不到 project.yml —— 这个 workflow 要放在 Still-iOS/ 里，或放在仓库根"
            exit 1
          fi

      - name: 看一眼 Xcode 版本
        run: xcodebuild -version

      # 先跑不要 Xcode 的静态自检，错了就别浪费 macOS 分钟数（10 倍计费）
      - name: 静态自检
        working-directory: ${{ steps.loc.outputs.dir }}
        run: node Tools/_check.js

      # ★ 2026-10-21：小窗里的猫「倒过来」已经折腾三次（v47 两次 + v51），
      #   每次都是肉眼在真机上判方向，判错就白编一轮。这里把方向钉成数字：
      #   走一遍跟 LiveFramePump.compose 完全相同的像素缓冲/上下文/翻转，
      #   读内存第 0 行（画面顶部）看是红还是蓝。不过就当场失败，别出包。
      - name: 小窗方向自检（猫不能倒）
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          swift Tools/flipcheck/main.swift | tee flipcheck.log

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ${{ steps.loc.outputs.dir }}
        run: xcodegen generate

      # ── 1. 模拟器版：为了截图，看它到底长什么样 ────────────────
      - name: 编译（模拟器，ad-hoc 签名）
        id: simbuild
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Still \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee build.log

      # 一个 Swift 错误经常带出几十条级联报错，所以只看 error: 行
      - name: 挑出报错
        if: failure()
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          echo "════ error（最多 60 条）════"
          grep -E "error:" build.log | head -60 || true
          echo ""
          echo "════ 提示：先修第一条，Swift 的级联报错会自己消失 ════"

          # ★ 2026-10-20：把错误升成 GitHub 注解。
          #   工作流日志和产物下载都要仓库管理员权限，而这台机器上只有 SSH 推送权、
          #   没有 API token —— 结果是「CI 红了但看不见红在哪」。
          #   注解（::error）是唯一能匿名读到的出口，从此失败不用登进去翻日志。
          python3 - <<'PY'
          import re
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          n = 0
          for l in lines:
              if 'error:' in l or '** BUILD FAILED **' in l:
                  m = re.match(r'^([^:]+\.swift):(\d+):(\d+):\s*error:\s*(.*)$', l)
                  if m:
                      print('::error file=%s,line=%s,col=%s::%s'
                            % (m.group(1), m.group(2), m.group(3), esc(l)))
                  else:
                      print('::error ::%s' % esc(l))
                  n += 1
                  if n >= 15:
                      break
          if n == 0:
              # 一条 error: 都没有 —— 把日志末尾原样抛出来，别让我瞎猜
              print('::error ::build.log 里没有 error: 行，下面是日志末尾 15 行：')
              for l in lines[-15:]:
                  print('::error ::%s' % esc(l))
          PY

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: ${{ steps.loc.outputs.dir }}/build.log
          retention-days: 7

      # ── 2. 跑起来截图 ────────────────────────────────────────
      # 「猫画得对不对」唯一的免费验证手段，别删。
      - name: 启动模拟器并截图
        if: success()
        continue-on-error: true
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -ex
          mkdir -p shots

          # 找一台可用的 iPhone 模拟器（不同 Xcode 预装的型号不一样，别写死名字）
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          d = json.load(sys.stdin)["devices"]
          cands = [x for k, v in d.items() if "iOS" in k
                     for x in v if x["name"].startswith("iPhone") and x.get("isAvailable")]
          print(cands[0]["udid"] if cands else "")
          ')
          if [ -z "$UDID" ]; then
            echo "::error::找不到可用的 iPhone 模拟器"
            exit 1
          fi
          echo "用模拟器 UDID：$UDID"

          # 冷启动模拟器比较慢，bootstatus -b 会等到开机完成
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl boot "$UDID" || true

          APP=build/Build/Products/Debug-iphonesimulator/Still.app
          echo "=== 待安装 App 是否存在 ==="
          ls -la "$APP" || { echo "::error::找不到 Still.app，编译产物路径可能变了"; exit 1; }

          echo "=== 安装 ==="
          xcrun simctl install "$UDID" "$APP"

          echo "=== 启动主 App ==="
          xcrun simctl launch "$UDID" com.still.Still

          # 默认 300× 演示速度，隔几秒截一张就能看到它挪窝
          # 文件名用 ASCII，避免 runner 默认 locale 下中文名写入失败导致产物缺失
          sleep 4;  xcrun simctl io "$UDID" screenshot shots/01-open.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/02-8s.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/03-16s.png
          sleep 10; xcrun simctl io "$UDID" screenshot shots/04-26s.png

          echo "=== 截图产物 ==="
          ls -la shots
          file shots/*.png || true

      - name: 上传截图
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: still-screenshots
          path: ${{ steps.loc.outputs.dir }}/shots
          retention-days: 30

      # ── 3. 真机 arm64 ─────────────────────────────────────────
      # 两种情况，用 IOS_SIGNING_CERT 是否为空来分岔：
      #   · 没填（默认）→ 只验证「代码能为真机 arm64 编过」，并出未签名包给 AltStore 重签。
      #     （Xcode 16.4 禁止对真机 SDK 用 ad-hoc，所以这里不能自己签。）
      #   · 填了      → 走 4b，导入你的证书和描述文件，真签名出可安装的 .ipa。
      # 注意：免费 Apple ID 的描述文件只有 7 天有效期，所以就算 CI 能签，
      # 每周也要重新生成描述文件 —— 这也是「日常用 AltStore 自动续」更省事的原因。
      - name: 编译（真机 arm64，仅验证可编译·不签名）
        id: device
        if: ${{ env.IOS_SIGNING_CERT == '' }}
        continue-on-error: true
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          # ★ TARGETED_DEVICE_FAMILY=1（只要 iPhone）必须在这里命令行传。
          #   project.yml 的 settings.base 和 Info.plist 里写都不作数 ——
          #   Xcode 在 Process Info.plist 那一步会用这个 build setting 重新生成
          #   UIDeviceFamily，不传就是默认的 [1, 2]（iPhone + iPad）。
          #   系统一看是通用 App，iPhone 的组件库就不把它算作
          #   「为 iPhone 主屏幕优化」的那批 —— 表现就是搜不到、加不了。
          xcodebuild \
            -scheme Still \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-device.log

      - name: 检查 App Group entitlement 是否配置（决定小组件能不能用）
        if: steps.device.outcome == 'success'
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          echo "════ 主 App entitlements ════"
          grep -A2 application-groups Still.entitlements 2>&1 || echo "(未找到 Still.entitlements)"
          echo ""
          echo "════ Widget Extension entitlements ════"
          grep -A2 application-groups StillWidget.entitlements 2>&1 || echo "(未找到 StillWidget.entitlements)"
          echo ""
          echo "→ 两边都必须出现 com.apple.security.application-groups，且值是同一个。"
          echo "  少了它，小组件读不到行程表，会一直显示「还没接它回家」。"
          echo "  （真机签名时会由 Xcode + 你的免费 Apple ID 把它真正签进包里。）"

      # ── 4a. 未签名 .ipa（默认路径：给 AltStore 在你自己电脑上重签 → 装手机）──
      # 这是「不花钱、不用 Mac」那条路的关键产物：CI 出包，AltServer 用你的免费
      # Apple ID 在 Windows 上重签并安装到手机，7 天到期后 AltStore 还能自动续。
      - name: 打包未签名 .ipa（供 AltStore 本机重签）
        id: unsignedipa
        if: ${{ env.IOS_SIGNING_CERT == '' }}
        continue-on-error: true
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -e
          cd build-device/Build/Products/Release-iphoneos
          rm -rf Payload Still-unsigned.ipa
          mkdir Payload
          cp -R Still.app Payload/
          zip -qry Still-unsigned.ipa Payload
          echo "打好了：$(du -h Still-unsigned.ipa | cut -f1)"
          echo "含扩展：$(ls Payload/Still.app/PlugIns 2>/dev/null || echo '(无)')"

      # ── 4a-1. ★ 门禁：包里那几段视频必须真的能播 ───────────────────
      #
      # 为什么值得单独立一道门：
      #   「素材进包了」和「素材能播」是两件事。
      #   文件被改坏时体积只差十几个字节，编译零报错、运行零日志，
      #   唯一的现象是**那间房整个空掉** ——
      #   你会去怀疑 UI、怀疑播放器、怀疑系统版本，就是不会怀疑文件本身。
      #   实测踩过：推送脚本给所有文件做了换行规范化，把二进制里恰好出现的
      #   0x0D 0x0A 一起吃掉，11 段 mp4 全废，
      #   而每一道「素材在不在包里」的检查都显示正常。
      #
      # 这道门查的是**最终 ipa 里的那几个文件**，比对内容指纹 + container 结构。
      # 一旦红了，后面的 artifact / 直链都不会发出去 —— 坏的包到不了手机。
      - name: ★ 校验包里的视频片段（解不开就红）
        if: ${{ env.IOS_SIGNING_CERT == '' && steps.unsignedipa.outcome == 'success' }}
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -e
          IPA=build-device/Build/Products/Release-iphoneos/Still-unsigned.ipa
          rm -rf "$RUNNER_TEMP/pipcheck" && mkdir -p "$RUNNER_TEMP/pipcheck"
          unzip -q -o -j "$IPA" 'Payload/Still.app/*.mp4' -d "$RUNNER_TEMP/pipcheck"
          echo "从 ipa 里解出 $(ls "$RUNNER_TEMP/pipcheck" | wc -l | tr -d ' ') 段"
          python3 Tools/_pip_manifest.py --check --dir "$RUNNER_TEMP/pipcheck"

      - name: 上传未签名 .ipa
        if: ${{ env.IOS_SIGNING_CERT == '' && steps.unsignedipa.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: Still-unsigned-ipa
          path: ${{ steps.loc.outputs.dir }}/build-device/Build/Products/Release-iphoneos/Still-unsigned.ipa
          retention-days: 30

      # ── 4a-2. 同一份 ipa 再发一份到 Release，拿到「免登录直链」──────
      # 为什么：Actions 的 artifact 必须登录 GitHub 才能下。public 仓库的 Release
      #         附件是匿名可下的 —— 于是 iPhone 自带 Safari 打开这个链接就能把 ipa
      #         存到「文件」，再交给全能签/轻松签签名安装，全程不用电脑。
      # 直链：https://github.com/<owner>/<repo>/releases/download/nightly/Still-unsigned.ipa
      - name: 发布免登录直链（Release 附件）
        if: ${{ env.IOS_SIGNING_CERT == '' && steps.unsignedipa.outcome == 'success' }}
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IPA=build-device/Build/Products/Release-iphoneos/Still-unsigned.ipa
          TAG=nightly
          NOTE="每次推送自动构建的最新未签名包（Release 配置）。
          提交 ${{ github.sha }} · $(date -u '+%Y-%m-%d %H:%M UTC')
          下载后用全能签 / 轻松签 / AltStore 重签即可安装。"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Still 每夜构建" --notes "$NOTE"

          gh release upload "$TAG" "$IPA" --clobber

          echo "════ 免登录直链 ════"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/Still-unsigned.ipa"

      # ── 4b. 真机签名出包（填了 Secrets 才走这条路）──────────────
      - name: 导入证书与描述文件（签名准备）
        id: signprep
        if: ${{ env.IOS_SIGNING_CERT != '' }}
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -eo pipefail
          # ★ v87：这一步的每一步输出都存一份到 signprep.log ——
          #   它失败就会把后面所有签名步骤全跳掉，而 Actions 日志要登录才能看，
          #   没有 Mac 的时候只能靠这份日志知道到底卡在哪一句。
          exec > >(tee signprep.log) 2>&1
          KC="$RUNNER_TEMP/still.keychain"
          KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"

          echo "$IOS_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          ls -l "$RUNNER_TEMP/cert.p12"

          # ★ 先拿 openssl 验一下密码对不对。老证书很多是 RC2 加密的，
          #   macOS 自带的 LibreSSL 认得它，Windows 上的 OpenSSL 3 不认（要 -legacy）。
          #   密码错 / 文件根本不是 p12，在这里就能看出来，不用等签名那一步。
          echo "════ 证书自检（openssl）════"
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys \
            -passin pass:"$IOS_SIGNING_CERT_PASSWORD" 2>&1 | grep -i "subject\|issuer\|MAC\|error" | head -10 \
            || echo "（openssl 读不出来 —— 可能是这版不支持这种加密格式，继续走 security import）"

          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$IOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # ★★★ 必须把苹果的「中间证书」也导进这把钥匙串。
          #
          #   我们导进去的那张 .p12 **只含 HSBC 这一张证书**，不含签发它的
          #   Apple WWDR。而这把钥匙串是剛新建的、里面除了它什么都没有 ——
          #   Xcode 验签名时要凑齐「HSBC 证书 → Apple WWDR → Apple 根证书」这一整条链，
          #   缺了中间那张，它就报：
          #     Signing certificate is invalid … may have been revoked or expired
          #   （**不是真的被吊销，是链断了** —— 证书本身到 2028 年才到期，实测过）。
          echo "════ 补苹果中间证书 ════"
          for u in \
            "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" \
            "https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer" \
            "https://www.apple.com/appleca/AppleIncRootCertificate.cer"; do
            n=$(basename "$u")
            if curl -sfL --max-time 30 "$u" -o "$RUNNER_TEMP/$n"; then
              security import "$RUNNER_TEMP/$n" -k "$KC" -T /usr/bin/codesign \
                -T /usr/bin/security 2>&1 | sed "s/^/  $n: /"
              echo "  ✓ $n"
            else
              echo "  !! 没下到 $n（继续，钥匙串里本来就有的话不影响）"
            fi
          done

          # ⚠️ 别在这里用 `security add-trusted-cert` / `dump-trust-settings` ——
          #   实测它会**卡住等输入**（非交互环境下永远等下去，v87 那次整整挂了 20 分钟
          #   把整条流水线拖死）。信任锚靠下面把系统钥匙串放回搜索列表就够了。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" || true
          # ★ 别把原来的钥匙串从搜索列表里挤掉 —— 系统钥匙串里那份 Apple 根证书
          #   才是「被信任的锚」，少了它 Xcode 照样说证书无效。
          OTHERS=$(security list-keychains -d user | sed 's/^ *//; s/"//g' | tr '\n' ' ')
          security list-keychains -d user -s "$KC" /Library/Keychains/System.keychain $OTHERS
          security default-keychain -s "$KC"
          echo "════ 搜索列表 ════"
          security list-keychains -d user

          # ★★ 这一步是「到底为什么无效」的判官：
          #   链没凑齐 → CSSMERR_TP_NOT_TRUSTED / unable to build chain
          #   真被吊销 → CSSMERR_TP_CERT_REVOKED
          #   过期     → CSSMERR_TP_CERT_EXPIRED
          echo "════ 证书链自检 ════"
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys \
            -passin pass:"$IOS_SIGNING_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem" 2>&1 | tail -2
          # ★ 只给 30 秒：它会联网查吊销状态，网络不通能一直等到天荒地老。
          #   macOS 没有 timeout 命令，用 perl 的 alarm 兜住。
          perl -e 'alarm 30; exec(@ARGV)' security verify-cert -c "$RUNNER_TEMP/cert.pem" -p codesigning 2>&1 \
            | sed 's/^/  /' || echo "  （30 秒内没验完，跳过）"

          # ★★ 判官：直接拿 codesign 试签一个空文件。
          #   Xcode 那句 "may have been revoked or expired" 是句含糊话，
          #   codesign 给的才是真原因（revoked / not trusted / no identity）。
          echo "════ 拿 codesign 试签一个空文件 ════"
          echo hello > "$RUNNER_TEMP/probe.txt"
          for who in "iPhone Distribution: HSBC Bank plc" "iPhone Distribution"; do
            echo "  —— 用身份：$who"
            perl -e 'alarm 60; exec(@ARGV)' codesign -s "$who" --keychain "$KC" \
              --force "$RUNNER_TEMP/probe.txt" 2>&1 | sed 's/^/     /' \
              && echo "     ✓ 签成功了" || echo "     ✗ 没签成（上面是原文）"
          done
          codesign -dvvv "$RUNNER_TEMP/probe.txt" 2>&1 | sed 's/^/  /' | head -8

          echo "════ 钥匙串里的签名身份 ════"
          # ★ 用 case 判断，别用 `| grep -q` —— 开了 pipefail 之后
          #   grep -q 提前退出会把上一条命令撞成 SIGPIPE，误判成"没身份"。
          IDENT=$(security find-identity -v -p codesigning "$KC")
          echo "$IDENT"
          case "$IDENT" in
            *"valid identit"*) echo "  ✓ 证书已就位" ;;
            *)
              echo "!! 钥匙串里没有可用的签名身份 —— 证书没导进去（密码不对，或这版 macOS 不认这种老格式）"
              exit 1 ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local out="$RUNNER_TEMP/$1.mobileprovision" uuid
            echo "$2" | base64 --decode > "$out"
            # ★ 解出来的 plist 先落盘再给 PlistBuddy ——
            #   直接从 /dev/stdin 读，PlistBuddy 有时读不到（管道不可 seek）。
            security cms -D -i "$out" > "$out.plist" || { echo "!! 描述文件解不开：$1"; return 1; }
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$out.plist")
            cp "$out" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "  $1 → $uuid"
            echo "$uuid"
          }
          echo "════ 安装描述文件 ════"
          APP_UUID=$(install_profile app "$IOS_PROVISION_PROFILE_APP" | tail -1)
          # ★ 扩展的描述文件**可以不给**：企业（In-House）描述文件的 App ID 常常是写死的，
          #   只覆盖主 App 一个 ID，扩展没有对应的可签（见下一步「为什么砍掉小组件」）。
          WIDGET_UUID=""
          if [ -n "$IOS_PROVISION_PROFILE_WIDGET" ]; then
            WIDGET_UUID=$(install_profile widget "$IOS_PROVISION_PROFILE_WIDGET" | tail -1)
          else
            echo "  widget →（没给，下一步会把小组件从工程里摘掉）"
          fi
          echo "APP_UUID=$APP_UUID"       >> "$GITHUB_OUTPUT"
          echo "WIDGET_UUID=$WIDGET_UUID" >> "$GITHUB_OUTPUT"

          echo "════ 描述文件里的 App ID（包名必须跟它一模一样）════"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/app.mobileprovision.plist"
          echo "════ 描述文件里的权限（工程里声明了它没给的，签名会失败）════"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$RUNNER_TEMP/app.mobileprovision.plist"

      # ── 4b-0. ★ 按签名的形态改造工程（只有真签名才走这一步）────────
      #
      # 为什么非改不可（这三条都是实测出来的，不是猜的）：
      #
      #   ① **包名必须换成描述文件里那个**。iOS 装包时逐字比对 App 的 CFBundleIdentifier
      #      和 embedded.mobileprovision 里的 application-identifier；这张企业描述文件的
      #      App ID 是写死的（不是通配 `*`），所以不换就装不上。
      #      ⇒ 换了他手机上现在那个包还是同一个 —— 他自己用全能签签的时候已经换过一次了，
      #        所以新包是覆盖安装，猫和账号都在。
      #
      #   ② **必须摘掉 App Group**。这张描述文件的 Entitlements 里**没有**
      #      com.apple.security.application-groups（实测只有 aps-environment /
      #      application-identifier / team-identifier / keychain-access-groups）。
      #      工程里却声明了 group.com.still.app ⇒ Xcode 会直接报
      #      “Provisioning profile doesn't include the com.apple.security.application-groups entitlement”。
      #      摘掉以后代码不受影响：RoomScope 那几处都是 `guard let … else { return }`，拿不到就降级。
      #
      #   ③ **必须砍掉小组件扩展**。扩展是另一个可执行文件，也得有自己的描述文件；
      #      主 App 这份写死的 App ID 覆盖不到 com.still.app.widget ⇒ 签了也装不上。
      #      （填了 IOS_PROVISION_PROFILE_WIDGET 就不砍。）
      - name: 按签名形态改造工程
        if: ${{ env.IOS_SIGNING_CERT != '' }}
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -eo pipefail
          # ★ v87：这一步改完工程长什么样，后面签名对不上一眼看不出来，留一份日志。
          exec > >(tee signmod.log) 2>&1
          python3 - <<'PY'
          import os, shutil
          p = 'project.yml'
          if not os.path.exists(p + '.orig'):
              shutil.copy(p, p + '.orig')
          s = open(p + '.orig', encoding='utf-8').read()
          bid   = os.environ.get('IOS_APP_BUNDLE_ID', '').strip()
          drop  = os.environ.get('IOS_PROVISION_PROFILE_WIDGET', '').strip() == ''

          # ① 换主 App 包名
          if bid:
              old = 'productBundleIdentifier: com.still.app\n'
              assert old in s, 'project.yml 里找不到主 App 的包名行，改造中止'
              s = s.replace(old, 'productBundleIdentifier: %s\n' % bid, 1)
              print('包名 com.still.app → %s' % bid)

          # ② 摘掉 App Group（描述文件没有这项权限，留着签名必失败）
          #    ★ 这里必须写成一行行拼的字符串：YAML 块标量里，缩进比第一行浅的行
          #      会被当成「块结束」，用三引号原样写会把整个 workflow 写坏。
          grp = ('    entitlements:\n'
                 '      path: Still.entitlements\n'
                 '      properties:\n'
                 '        com.apple.security.application-groups:\n'
                 '          - group.com.still.app\n')
          if grp in s:
              s = s.replace(grp, '    entitlements:\n      path: Still.entitlements\n')
              print('已摘掉 App Group（group.com.still.app）')
          else:
              print('!! 没找到 App Group 那段，检查一下 project.yml 是不是改过')

          # ③ 砍掉小组件扩展
          if drop:
              i = s.find('\n  StillWidgetExtension:')
              j = s.find('\n# ── Scheme')
              if i > 0 and j > i:
                  s = s[:i] + '\n\n' + s[j:]
              # 主 App 底下那段 dependencies 里只剩注释了 —— 留着会变成空值
              # （YAML 解析成 None，XcodeGen 不一定吃得下），整块拿掉最干净。
              lines = s.split('\n')
              out, k = [], 0
              while k < len(lines):
                  if lines[k] == '    dependencies:':
                      k += 1
                      while (k < len(lines) and lines[k].startswith('      ')
                             and not lines[k].startswith('       ')):
                          k += 1
                      continue
                  out.append(lines[k]); k += 1
              s = '\n'.join(out)
              s = s.replace('        StillWidgetExtension: all\n', '')
              print('已砍掉 StillWidgetExtension（没有扩展描述文件）')

          open(p, 'w', encoding='utf-8').write(s)
          print('改造后的 target 数：', s.count('productBundleIdentifier:'))
          PY

          # 用改造后的 yml 重新生成工程（模拟器那一步用的是原工程，互不干扰）
          xcodegen generate
          echo "════ 改造后 project.yml 里的包名 ════"
          grep -n "productBundleIdentifier" project.yml
          echo "════ 生成出来的工程里真正生效的包名 ════"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" Still.xcodeproj/project.pbxproj | sort -u

      - name: 归档并导出已签名 .ipa
        id: signarchive
        if: ${{ env.IOS_SIGNING_CERT != '' }}
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          APP_UUID: ${{ steps.signprep.outputs.APP_UUID }}
          WIDGET_UUID: ${{ steps.signprep.outputs.WIDGET_UUID }}
        run: |
          set -o pipefail

          # ExportOptions 里的 key 必须是**真实包名**（原来是 com.still.Still，
          # 而工程里一直是 com.still.app —— 对不上，导出必失败）。这里按改造后的名字生成。
          python3 - <<'PY'
          import os
          app_uuid = os.environ['APP_UUID']
          wid_uuid = os.environ.get('WIDGET_UUID', '').strip()
          bid      = os.environ['IOS_APP_BUNDLE_ID'].strip() or 'com.still.app'
          method   = os.environ['IOS_EXPORT_METHOD'].strip() or 'enterprise'
          team     = os.environ['IOS_DEVELOPMENT_TEAM'].strip()

          rows = '        <key>%s</key><string>%s</string>\n' % (bid, app_uuid)
          if wid_uuid:
              rows += '        <key>com.still.app.widget</key><string>%s</string>\n' % wid_uuid

          open('ExportOptions.plist', 'w').write(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
              '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0"><dict>\n'
              '  <key>method</key><string>%s</string>\n'
              '  <key>teamID</key><string>%s</string>\n'
              '  <key>signingStyle</key><string>manual</string>\n'
              '  <key>stripSwiftSymbols</key><true/>\n'
              '  <key>provisioningProfiles</key><dict>\n'
              '%s'
              '  </dict>\n'
              '</dict></plist>\n' % (method, team, rows))
          print('导出方式：%s（包名 %s，Team %s）' % (method, bid, team))
          PY
          cat ExportOptions.plist

          # ★ TARGETED_DEVICE_FAMILY=1（只要 iPhone）必须在这里显式传。
          #
          #   写在 project.yml 的 settings.base 里**不生效** —— 打出来的包
          #   UIDeviceFamily 一直是 [1, 2]（iPhone + iPad），Info.plist 里显式写也盖不住，
          #   因为 Xcode 在 Process Info.plist 那一步会用这个 build setting 重新生成它。
          #   命令行参数的优先级最高，这里传才作数。
          xcodebuild -scheme Still -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath Still.xcarchive archive \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='${{ env.IOS_DEVELOPMENT_TEAM }}' \
            CODE_SIGN_IDENTITY='${{ env.IOS_SIGNING_IDENTITY }}' \
            PROVISIONING_PROFILE_SPECIFIER="$APP_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER='${{ env.IOS_APP_BUNDLE_ID }}' 2>&1 | tee archive.log

          xcodebuild -exportArchive -archivePath Still.xcarchive \
            -exportPath out -exportOptionsPlist ExportOptions.plist 2>&1 | tee export.log

          echo "════ 产物 ════"
          ls -la out

          # 当场验一次：包里到底签上名没有（没签就别往下发）
          IPA=out/Still.ipa
          echo "════ 签名自检 ════"
          unzip -p "$IPA" 'Payload/*.app/embedded.mobileprovision' | \
            security cms -D -i /dev/stdin 2>/dev/null | \
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin \
            || echo "!! 没读到 embedded.mobileprovision —— 这个包没签上"

      - name: 上传已签名 .ipa（可直接侧载到手机）
        if: ${{ env.IOS_SIGNING_CERT != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: Still-device-ipa
          path: ${{ steps.loc.outputs.dir }}/out/Still.ipa
          retention-days: 30

      # 同一份签好的包再发一份到 Release，拿到「免登录直链」：
      # iPhone 自带 Safari 打开就能存到「文件」→ 直接装，不用电脑、不用全能签再签一次。
      - name: 发布免登录直链（已签名包）
        if: ${{ env.IOS_SIGNING_CERT != '' && steps.signarchive.outcome == 'success' }}
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IPA=$(ls out/*.ipa 2>/dev/null | head -1)
          [ -n "$IPA" ] || { echo "::error::out 里没有 ipa"; exit 1; }
          echo "要发的是 $IPA（$(du -h "$IPA" | cut -f1)）"
          TAG=device
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Still 已签名包（点开就能装）" \
              --notes "企业证书签名，下载后直接用 iPhone 自带 Safari 打开即可安装（装完要在
          设置 → 通用 → VPN与设备管理 里信任一次这个企业级 App）。
          提交 ${{ github.sha }} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          gh release upload "$TAG" "$IPA" --clobber
          echo "════ 免登录直链 ════"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$(basename "$IPA")"

      - name: 真机编译日志（失败时看这个）
        if: steps.device.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: build-device-failed-log
          path: ${{ steps.loc.outputs.dir }}/build-device.log
          retention-days: 7

      # 失败时把编译日志一并丢到 Release：artifact 和 Actions 日志都要登录才能看，
      # 而 Release 附件匿名可下 —— 没有 Mac 的时候，这是唯一能立刻看到 error: 的办法。
      - name: 失败时把日志发到 Release（免登录可查）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DIR="${{ steps.loc.outputs.dir }}"
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --title "Still 每夜构建" --notes "自动构建（含失败日志）"
          for f in build.log build-device.log archive.log export.log signprep.log signmod.log; do
            if [ -f "$DIR/$f" ]; then gh release upload nightly "$DIR/$f" --clobber || true; fi
          done
          echo "已上传：https://github.com/${{ github.repository }}/releases/download/nightly/build.log"
