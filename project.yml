name: Still
options:
  bundleIdPrefix: com.still
  # ★★★ 2026-10-21：Siri 短语的语言必须是中文。
  #
  #   这一行不改的后果（我从 v53 的包里挖出来的，不是猜的）：
  #   `Payload/Still.app/Metadata.appintents/root.ssu.yaml` 里五句短语
  #   （跟还在说句话 / 对还在说句话 / 叫还在出来说话 / 给还在写句话 / 跟还在打字说话）
  #   **全部标着 `locale: en`** —— 因为 XcodeGen 默认 developmentLanguage 是 en，
  #   Info.plist 里 CFBundleDevelopmentRegion 也就成了 en。
  #
  #   中文的 Siri 去匹配「英文」的语料，中文那句「跟还在说句话」会被按英文去切词。
  #   这就是「短语明明在包里，说了却没反应」最可能的来源。
  #
  #   改成 zh-Hans 之后，语料会标成 zh-Hans，中文 Siri 才对得上。
  #   ★ 短语文本本身不用动 —— 它已经是中文了，错的只是语言标签。
  developmentLanguage: "zh-Hans"
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: none
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.97.0"
    CURRENT_PROJECT_VERSION: "97"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: "YES"

targets:

  # ── 主 App ────────────────────────────────────────────────
  Still:
    type: application
    platform: iOS
    # 显式写死，别让 XcodeGen 拿 bundleIdPrefix 去拼 —— 拼出来的名字
    # 一改 target 就变，签名和 App Group 跟着乱。
    productBundleIdentifier: com.still.app
    sources:
      # 一个 path 就够 —— Sources/App 已经含了 Shared/、Cat/、Home/、Panel/、PiP/。
      # 别再单独列 Shared/ 和 Cat/，XcodeGen 会生成两份引用，
      # 同一个 .swift 被编译两次 → duplicate symbol。
      - path: Sources/App
        excludes:
          - "Island/**"
      # 画中画要播的片段。素材是「4K 透明动作视频叠房间底图」合成的 720×720 方片
      # （Tools/_pip_compose.py pack），合计约 4.6 MB。
      # ★ 显式写 buildPhase：这些是资源不是源码，放错会静默不打包 ——
      #   真机上只表现成「画面全黑」，编译一点问题都没有。
      - path: Resources
        buildPhase: resources
    entitlements:
      path: Still.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.still.app
    # ★ 这段权限声明不要删。
    #  曾经为了「自签工具可能签不上」把它去掉过，结果小组件反而搜不到了 ——
    #  带它的时候（旧版）是能正常添加的。去掉之后变量太多，无法定位。
    #  现在的结论：它无害，删了反而可能让重签工具跳过对插件的签名。
    info:
      path: Still-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "还在"
        # ★ 与上面 options.developmentLanguage 配套：Info.plist 里也钉死，
        #   别让它自己回落到 en（回落了 Siri 语料又会变回英文标签）。
        CFBundleDevelopmentRegion: "zh-Hans"
        # ★★★ v63：给自己一个 URL scheme，为的是「小窗上按一下 → 把 App 拉起来」。
        #   小窗是系统的独立窗口，**弹不了 App 里的输入框**；要弹，只能把 App 顶到前台。
        #   而「把自己叫到前台」唯一公开的口子就是 open 一个自己的 scheme。
        CFBundleURLTypes:
          - CFBundleURLName: "com.still.Still.talk"
            CFBundleURLSchemes:
              - "still"
        # ★ v65：小窗那个键「把自己叫到前台」用的 activity 类型。
        #   不声明也能收，但声明了系统才不会把它当成陌生的 Handoff 丢掉。
        NSUserActivityTypes:
          - "com.still.Still.talk"
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # ★ 画中画的硬前提。缺了它 PiP 会**静默失效**：不报错、不崩溃，就是什么都不发生。
        #   配合 AVAudioSession.setCategory(.playback)+setActive(true) 一起用。
        UIBackgroundModes:
          - audio
        # SwiftUI App 生命周期，不需要 SceneDelegate
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ★★★ v45：**这两行是「键盘永远弹不出来」的真凶**。
        #
        #   现场数据（v44 真机上报）：
        #     窗口尺寸 = 320x480      ← 这不是任何一台现代 iPhone 的点尺寸
        #     安全区底 = 0            ← 有刘海的机器应该是 34
        #     输入法   = —            ← 系统一个输入法都没交给我们
        #     场景状态 = 未连接
        #
        #   320×480 是 iOS 在「App 没有声明启动画面」时的**兼容模式回退尺寸**：
        #   App 被当成没适配过的老应用，在一个 320×480 的画布里渲染再放大。
        #   这种模式下输入法（键盘）服务注入不上 —— `activeInputModes` 直接是空的，
        #   所以 `becomeFirstResponder()` 永远返回 true、但键盘永远不出现。
        #   这就是 v36→v44 一共九版都在改「输入框怎么摆」却一点没变的原因：
        #   **根子不在输入框，在 App 的清单里少了一行。**
        #
        #   `UILaunchScreen: {}` = 用系统默认的空白启动画面（不需要额外文件），
        #   声明之后 App 就以现代全屏模式运行，键盘服务正常注入。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # ★ v48：这一版新开的三样能力，每一句都要说清「用来干什么」——
        #   审核和用户看到的都是这句，写「需要相机权限」会被拒。
        NSCameraUsageDescription: "「带它进现实」要用相机，把它放进你眼前的真实画面里；「扫一扫」也要用它读那张派遣单的码。"
        # ★ v71：原来这句写的是「按住小爪说话」，那是**安卓浮窗**的用法。
        #   iOS 这边现在是「按一下小窗上那个键，它就开始听」—— 用户弹窗里看到的
        #   必须是眼前真要发生的那件事，所以改成中性的说法，两种入口都盖得住。
        NSMicrophoneUsageDescription: "让它听着你说的话，把话变成文字。相机录像时也会收音。"
        NSSpeechRecognitionUsageDescription: "把你说的话转成文字，才能让它听懂。语音只在这台手机上转换。"
        NSPhotoLibraryUsageDescription: "选一张它的照片来登记角色，或者挑一段动作视频交给台子抠像。"
        NSPhotoLibraryAddUsageDescription: "把拍下来的照片、录下来的视频、还有派它出门那张二维码存进相册。"
    dependencies:
      # 注意：target 名 ≠ 类型名。Sources/Widget/StillWidget.swift 里有个 struct 也叫 StillWidget，
      # 如果 target 也叫 StillWidget，就会出现「模块和类型同名」的歧义报错。
      # 所以这里沿用 Xcode 模板的命名习惯，后缀 Extension。
      - target: StillWidgetExtension

  # ── Widget Extension（小组件 + 灵动岛 UI）────────────────
  StillWidgetExtension:
    type: app-extension
    platform: iOS
    # 必须是「主 App 的 Bundle ID + 后缀」，这是 Apple 的硬规则，
    # 写成 com.still.widget 这种平级名字，签名时直接报错。
    productBundleIdentifier: com.still.app.widget
    sources:
      - path: Sources/Widget
      - path: Sources/App/Island
      - path: Sources/App/Shared
        # ★ v43：现场上报要读 UIApplication.shared / 键盘状态 —— 这些在扩展里是
        #   **不可用**的（编译直接报 'shared' is unavailable in application extensions）。
        #   组件用不上它，排除掉最干净。
        excludes:
          - "Diag.swift"
          # ★ v70 登录制：CatBrain 会给台子的请求贴票（`req.stillStamp()`），
          #   而登录那一套（钥匙串、票）**只在主 App 里**，扩展不该有凭证。
          #   组件里也没有任何地方用它（只有 Talk/CatTalk.swift 用）——
          #   留在扩展里只会编译不过。
          - "CatBrain.swift"
          # ★ v87：和上面同理 —— Credit.swift 要给台子的请求贴票（`req.stillStamp()`），
          #   登录那一套只在主 App 里。小组件不需要记账，排除掉。
          - "Credit.swift"
      - path: Sources/App/Cat
      - path: Sources/App/Home/WidgetCardView.swift
      # 组件里那张静态猫图。★ 显式写 buildPhase：png 是资源不是源码，
      # 不写会被静默不打包（真机表现就是组件里猫是空的）。
      - path: Resources/widget
        buildPhase: resources
    # ★★ 小组件扩展【不给】App Group 权限。这是让它能显示出内容的关键。
    #
    #  自签工具（全能签/轻松签）重签时生成的描述文件里，通常**不含**
    #  com.apple.security.application-groups。而扩展如果声明了这个权限，
    #  启动时 entitlement 与描述文件对不上 → 系统直接把扩展进程杀掉。
    #  表现就是：组件能在库里搜到、能加到桌面，但**永远是一片空白**
    #  （连预览缩略图都是空的）——因为画出内容的是扩展进程，它压根没起来。
    #
    #  主 App 那边的 App Group 保留（它自己的功能要用），
    #  Apple 允许扩展的权限是宿主 App 的子集，这样不冲突。
    #
    #  代价：小组件读不到共享容器 → RoomScope 的「自报家门」暂时失效，
    #  它先在预置的几间里跑。但行程表是确定性算的（Schedule.resolve），
    #  不依赖共享存储，唯一性不受影响。
    info:
      path: StillWidget-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "还在"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true

# ── Scheme ────────────────────────────────────────────────
# 显式定义，别指望 XcodeGen 自动生成的那个。
# CI 里 `xcodebuild -scheme Still` 报 "scheme not found" 是常见的翻车点。
schemes:
  Still:
    build:
      targets:
        Still: all
        StillWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
