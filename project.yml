name: Still
options:
  bundleIdPrefix: com.stillhome
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: none
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # ★★ 这两个版本号必须每出一版就跟着走（v13 → 1.13.0 / 13）。
    #
    #   iOS 对「App 有哪些扩展」这件事是按 (bundle id, 版本) 记住的。
    #   版本号一直是 1.0.0 / 1 的话，覆盖安装之后系统会认为「还是那一版」，
    #   于是沿用上一次那份登记 —— 上一次如果是坏的（扩展加载失败过），
    #   它就一直坏着。表现正好就是用户报的那句：**组件加不了，重启一次好一次**。
    #   以前每一版都是同一个版本号，这条一直在踩，只是没人把它连起来看。
    #
    #   顺带一个好处：设置 → 通用 → iPhone 储存空间 里能直接看到装的是第几版，
    #   「手机上到底跑的是哪一份」不再是靠猜。
    MARKETING_VERSION: "1.19.0"
    CURRENT_PROJECT_VERSION: "19"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: "YES"

targets:

  # ── 主 App ────────────────────────────────────────────────
  Still:
    type: application
    platform: iOS
    # 显式写死，别让 XcodeGen 拿 bundleIdPrefix 去拼 —— 拼出来的名字
    # 一改 target 就变，签名和 App Group 跟着乱。
    productBundleIdentifier: com.stillhome.still
    sources:
      # 一个 path 就够 —— Sources/App 已经含了 Shared/、Cat/、Home/、Panel/、PiP/。
      # 别再单独列 Shared/ 和 Cat/，XcodeGen 会生成两份引用，
      # 同一个 .swift 被编译两次 → duplicate symbol。
      - path: Sources/App
        excludes:
          - "Island/**"
      # 画中画要播的片段。素材是「4K 透明动作视频叠房间底图」合成的 720×720 方片
      # （Tools/_pip_compose.py pack），合计约 4.6 MB。
      # ★ 显式写 buildPhase：这些是资源不是源码，放错会静默不打包 ——
      #   真机上只表现成「画面全黑」，编译一点问题都没有。
      - path: Resources
        buildPhase: resources
    entitlements:
      path: Still.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stillhome.still
    # ★ 这段权限声明不要删。
    #  曾经为了「自签工具可能签不上」把它去掉过，结果小组件反而搜不到了 ——
    #  带它的时候（旧版）是能正常添加的。去掉之后变量太多，无法定位。
    #  现在的结论：它无害，删了反而可能让重签工具跳过对插件的签名。
    info:
      path: Still-Info.plist
      properties:
        # ★★ 这两行不能省。
        #
        #   XcodeGen 生成 Info.plist 时，`CFBundleShortVersionString` / `CFBundleVersion`
        #   写的是**字面量默认值** `1.0` / `1` —— 上面 settings 里的 MARKETING_VERSION /
        #   CURRENT_PROJECT_VERSION **不会自己流进去**。
        #   实测（v12 出包核对）：不写这两行，包里的版本号仍然是 1.0 / 1，
        #   等于「版本号每版都变」这件事压根没生效。（差点带着这个错发出去。）
        #
        #   `$(...)` 由 Xcode 在 Process Info.plist 那一趟替换掉，
        #   所以真正的数字只有 settings.base 那一处 —— 一处改，两个 target 一起走。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ★ 必须显式写。上面 settings 里的 TARGETED_DEVICE_FAMILY 不会流进 Info.plist ——
        #   不写的话 XcodeGen 塞的是默认值 [1, 2]（iPhone + iPad），
        #   系统就会把这个 App 当成通用 App，而不是纯 iPhone App。
        UIDeviceFamily: [1]
        CFBundleDisplayName: "还在"
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # ★★ 这里**故意不注册** UIAppFonts（v13 改动）。
        #   整个工程里唯一用到 StillFrames 的地方是小组件，主 App 一行都没用 ——
        #   注册它等于白让系统在每个进程启动时多解析一份我们自己造的 sbix 位图字体。
        #   风险不必要，收益为零。组件那边怎么拿字体：运行时按需注册，见 CatFont。
        #
        # ★ 画中画的硬前提。缺了它 PiP 会**静默失效**：不报错、不崩溃，就是什么都不发生。
        #   配合 AVAudioSession.setCategory(.playback)+setActive(true) 一起用。
        UIBackgroundModes:
          - audio
        # SwiftUI App 生命周期，不需要 SceneDelegate
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      # 注意：target 名 ≠ 类型名。Sources/Widget/StillWidget.swift 里有个 struct 也叫 StillWidget，
      # 如果 target 也叫 StillWidget，就会出现「模块和类型同名」的歧义报错。
      # 所以这里沿用 Xcode 模板的命名习惯，后缀 Extension。
      - target: StillWidgetExtension

  # ── Widget Extension（小组件 + 灵动岛 UI）────────────────
  StillWidgetExtension:
    type: app-extension
    platform: iOS
    # 必须是「主 App 的 Bundle ID + 后缀」，这是 Apple 的硬规则，
    # 写成 com.still.widget 这种平级名字，签名时直接报错。
    productBundleIdentifier: com.stillhome.still.widget
    sources:
      - path: Sources/Widget
      - path: Sources/App/Island
      - path: Sources/App/Shared
      - path: Sources/App/Cat
      - path: Sources/App/Home/WidgetCardView.swift
      # ★★ 这里**故意不放** Resources/fonts（v16 改动：回到 v9 的形态）。
      #
      #   v9 → v15 之间给扩展加过一份自造的 sbix 彩色位图字体（StillFrames.ttf），
      #   用来让组件里的猫逐帧动起来。代价是：**v9 能加组件，v11 起加不了。**
      #   v16 的首要目标是把「能加」拿回来，所以扩展里连字体文件都不放 ——
      #   不放文件，就不存在「系统解析这份字体时出事」这条路径。
      #
      #   猫暂时是 v9 那套矢量静态猫（`CatView`），一样有猫，只是不逐帧动。
      #   要加动画，等这一版确认能加之后，再**单独**加回来（一次只动一件事）。
      #   造字体的脚本 Tools/_cat_font.py 和 Resources/fonts/ 都留着，没删。
    # ★★ 小组件扩展【不给】App Group 权限。这是让它能显示出内容的关键。
    #
    #  自签工具（全能签/轻松签）重签时生成的描述文件里，通常**不含**
    #  com.apple.security.application-groups。而扩展如果声明了这个权限，
    #  启动时 entitlement 与描述文件对不上 → 系统直接把扩展进程杀掉。
    #  表现就是：组件能在库里搜到、能加到桌面，但**永远是一片空白**
    #  （连预览缩略图都是空的）——因为画出内容的是扩展进程，它压根没起来。
    #
    #  主 App 那边的 App Group 保留（它自己的功能要用），
    #  Apple 允许扩展的权限是宿主 App 的子集，这样不冲突。
    #
    #  代价：小组件读不到共享容器 → RoomScope 的「自报家门」暂时失效，
    #  它先在预置的几间里跑。但行程表是确定性算的（Schedule.resolve），
    #  不依赖共享存储，唯一性不受影响。
    # ★★ 小组件扩展专属编译标记：`WIDGET_EXT`
    #
    #   Shared/ 这个目录是两边共用的，但里面有一部分活儿**只有 App 能做**：
    #     · 开 / 关灵动岛（ActivityKit）
    #     · 向系统问「你桌面上摆了哪几张卡」（WidgetCenter.currentConfigurations）
    #   这些在扩展进程里跑既没有意义，也不该发生。
    #   加了这个标记之后，代码里用 `#if !WIDGET_EXT` 把它们隔出去，
    #   扩展编出来的二进制里就一个 ActivityKit / WidgetCenter 调用都没有。
    settings:
      OTHER_SWIFT_FLAGS: -D WIDGET_EXT
    info:
      path: StillWidget-Info.plist
      properties:
        # ★ 见主 App 那段的说明：不显式写，XcodeGen 会塞字面量 1.0 / 1。
        #   两个 target 的 CFBundleVersion **必须一致** —— 不一致系统会拒绝加载扩展。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ★ 同主 App：必须显式写 [1]，否则默认是 [1, 2]。
        #   小组件是按「给哪种设备」登记的，这里说 iPad 也行，
        #   iPhone 的组件库就不会把它算作「为 iPhone 主屏优化」的那些。
        UIDeviceFamily: [1]
        CFBundleDisplayName: "还在"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        # ★★ 这里**故意没有** UIAppFonts（v13 改动）。
        #
        #  以前在这里注册过，逻辑是「扩展不注册就读取不到字体」—— 那个逻辑本身没错，
        #  但代价算错了：注册 = 系统每次启动扩展都要解析这份自造字体，
        #  而一旦它被拒/解析出问题，赔上的是**整个 App 从组件库里消失**，
        #  不是「猫变成数字」这么便宜的事。
        #  现在改成运行时按需注册 + 失败降级为静态猫，两头都不丢。

# ── Scheme ────────────────────────────────────────────────
# 显式定义，别指望 XcodeGen 自动生成的那个。
# CI 里 `xcodebuild -scheme Still` 报 "scheme not found" 是常见的翻车点。
schemes:
  Still:
    build:
      targets:
        Still: all
        StillWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
